services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: osb
      POSTGRES_USER: osb
      POSTGRES_PASSWORD: osb-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osb -d osb"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
