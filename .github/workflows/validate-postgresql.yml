name: Validate PostgreSQL Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: osb
          POSTGRES_USER: osb
          POSTGRES_PASSWORD: osb-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osb -d osb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: osb-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        run: sh scripts/validate_migrations.sh
      - name: Apply migrations
        run: |
          for file in db/migrations/*.sql; do
            psql -h localhost -U osb -d osb -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify schema objects
        run: |
          psql -h localhost -U osb -d osb -Atc "select to_regclass('public.content_items') is not null" | grep -qx t
          psql -h localhost -U osb -d osb -Atc "select to_regclass('public.rights_records') is not null" | grep -qx t
          psql -h localhost -U osb -d osb -Atc "select to_regclass('public.audit_events') is not null" | grep -qx t
      - name: Test rollback
        run: |
          for file in db/rollback/*.sql; do
            psql -h localhost -U osb -d osb -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -h localhost -U osb -d osb -Atc "select to_regclass('public.content_items') is null" | grep -qx t
