name: Validate PostgreSQL Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: osb
          POSTGRES_USER: osb
          POSTGRES_PASSWORD: osb-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osb -d osb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: osb-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        run: sh scripts/validate_migrations.sh
      - name: Apply migrations
        run: |
          for file in $(find db/migrations -maxdepth 1 -name '*.sql' | sort); do
            psql -h localhost -U osb -d osb -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run database assertions
        run: |
          for file in $(find tests -maxdepth 1 -name '*.sql' | sort); do
            psql -h localhost -U osb -d osb -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Verify schema objects
        run: |
          for object in content_items rights_records audit_events tenants privacy_records preservation_events retention_rules; do
            psql -h localhost -U osb -d osb -Atc "select to_regclass('public.${object}') is not null" | grep -qx t
          done
      - name: Test rollback in reverse order
        run: |
          for file in $(find db/rollback -maxdepth 1 -name '*.sql' | sort -r); do
            psql -h localhost -U osb -d osb -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -h localhost -U osb -d osb -Atc "select to_regclass('public.content_items') is null" | grep -qx t
