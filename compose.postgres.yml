services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osb}
      POSTGRES_USER: ${POSTGRES_USER:-osb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osb_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osb} -d ${POSTGRES_DB:-osb}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - osb_postgres_data:/var/lib/postgresql/data

volumes:
  osb_postgres_data:
